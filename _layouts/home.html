---
layout: compress
---

<!DOCTYPE html>
<html lang="{{ site.language | default: 'en' }}" class="no-js">
  {% include head.html %}
  <body class="has-push-menu">

    {% include svg-icons.html %}
    {% include header.html %}

    <section class="content">
      {{ content }}
    </section>

    {% include footer.html %}

    {% if page.url == "/" %}
    <!-- BASE PAGE OVERLAY (3-click close) -->
    <style>
      #base-overlay {
        position: fixed;
        inset: 0;
        background: rgba(0,0,0,0.85);
        z-index: 999999;
        display: none; /* IMPORTANT */
        pointer-events: none;
      }

      #base-overlay .close {
        position: fixed;
        top: 20px;
        right: 20px;
        width: 36px;
        height: 36px;
        border-radius: 50%;
        background: #000;
        color: #fff;
        text-align: center;
        line-height: 36px;
        font-size: 22px;
        font-weight: bold;
        cursor: pointer;
        z-index: 1000000;
        user-select: none;
        pointer-events: auto;
      }

      #base-overlay .ad-box {
        position: fixed;
        top: 50%;
        left: 50%;
        transform: translate(-50%, -50%);
        background: #fff;
        padding: 12px;
        z-index: 999998;
        pointer-events: auto;
      }
    </style>

    <div id="base-overlay">
      <div class="close" onclick="baseClose()">×</div>

      <div class="ad-box">
        <script>
          atOptions = {
            'key' : 'c205b0c1e2fba08feb79f9665bfbe865',
            'format' : 'iframe',
            'height' : 90,
            'width' : 728,
            'params' : {}
          };
        </script>
        <script src="https://directsinew.com/c205b0c1e2fba08feb79f9665bfbe865/invoke.js"></script>
      </div>
    </div>

    <script>
      window.baseClicks = 0;

      window.addEventListener('load', function () {
        var o = document.getElementById('base-overlay');
        if (o) o.style.display = 'block';
      });

      function baseClose() {
        window.baseClicks++;
        if (window.baseClicks >= 3) {
          var o = document.getElementById('base-overlay');
          if (o) o.remove();
        }
      }
    </script>
    {% endif %}

  </body>
</html>
